[package]
name = "relay-baton-desktop"
version = "1.1.1"
description = "Desktop shell for relay-baton (Tauri sidecar over the CLI)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "relay_baton_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
