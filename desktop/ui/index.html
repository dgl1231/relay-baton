<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>relay-baton</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #0d1117;
        color: #e6edf3;
      }
      header {
        padding: 14px 20px;
        border-bottom: 1px solid #21262d;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      header h1 { font-size: 16px; margin: 0; font-weight: 600; }
      header .tag { font-size: 12px; color: #8b949e; }
      header .spacer { flex: 1; }
      main {
        padding: 20px;
        display: grid;
        gap: 16px;
        grid-template-columns: 1fr 1fr;
      }
      @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
      .card {
        border: 1px solid #21262d;
        border-radius: 8px;
        padding: 16px;
        background: #161b22;
        min-width: 0;
      }
      .card.wide { grid-column: 1 / -1; }
      .card h2 {
        font-size: 13px; margin: 0 0 10px; color: #8b949e;
        text-transform: uppercase; letter-spacing: .04em;
        display: flex; align-items: center; gap: 8px;
      }
      pre {
        margin: 0; white-space: pre-wrap; word-break: break-word;
        font-size: 13px;
      }
      pre.scroll { max-height: 320px; overflow: auto; }
      button {
        background: #238636; color: #fff; border: 0; border-radius: 6px;
        padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer;
      }
      button:hover { background: #2ea043; }
      select {
        background: #21262d; color: #e6edf3; border: 1px solid #30363d;
        border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 13px;
      }
      .muted { color: #8b949e; font-size: 12px; }
      .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13px; }
      .kv .k { color: #8b949e; }
      .badge {
        display: inline-block; padding: 1px 8px; border-radius: 10px;
        font-size: 12px; background: #21262d; border: 1px solid #30363d;
      }
      .bar { height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; margin: 4px 0 8px; }
      .bar > div { height: 100%; background: #238636; }
      .bar > div.hot { background: #da3633; }
      .err { color: #f85149; }

      /* conversation timeline */
      .timeline { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow: auto; }
      .ev { display: grid; grid-template-columns: max-content 1fr; gap: 10px; font-size: 13px; }
      .ev .who { white-space: nowrap; }
      .ev .role { font-weight: 600; }
      .role-user { color: #58a6ff; }
      .role-claude { color: #d2a8ff; }
      .role-codex { color: #7ee787; }
      .role-relay-baton, .role-relay { color: #f0b429; }
      .ev .kind { color: #8b949e; font-size: 11px; }
      .ev .text { white-space: pre-wrap; word-break: break-word; }
      .ev .ts { color: #6e7681; font-size: 11px; }

      /* actions toolbar + confirm modal */
      .actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .actions button { background: #21262d; border: 1px solid #30363d; }
      .actions button:hover { background: #30363d; }
      .actions button.ro { border-color: #2ea04366; }
      .confirm {
        margin-top: 12px; border: 1px solid #30363d; border-radius: 8px;
        padding: 12px; background: #0d1117; display: none;
      }
      .confirm.show { display: block; }
      .confirm code {
        display: block; background: #161b22; border: 1px solid #21262d;
        border-radius: 6px; padding: 8px 10px; margin: 8px 0; font-size: 13px;
        white-space: pre-wrap; word-break: break-word;
      }
      .confirm .warn { color: #f0b429; font-size: 12px; }
      .confirm .btns { display: flex; gap: 8px; margin-top: 8px; }
      .confirm .run { background: #238636; }
      .confirm .copy { background: #21262d; border: 1px solid #30363d; }
      .confirm .cancel { background: transparent; border: 1px solid #30363d; }
    </style>
  </head>
  <body>
    <header>
      <h1>relay-baton</h1>
      <span class="tag">desktop · read-only dashboard</span>
      <span class="spacer"></span>
      <label class="muted" for="project">project</label>
      <select id="project" title="switch active project"></select>
      <label class="muted" for="diet">diet</label>
      <select id="diet" title="diet profile passed to the next agent action (display only here)">
        <option>off</option><option>lite</option><option>balanced</option>
        <option selected>caveman</option><option>ultra</option>
      </select>
      <button id="refresh">Refresh</button>
    </header>
    <main>
      <div class="card">
        <h2>status</h2>
        <div id="status" class="kv">loading…</div>
      </div>
      <div class="card">
        <h2>budget</h2>
        <div id="budget">loading…</div>
      </div>
      <div class="card wide">
        <h2>handoff <span class="muted" id="handoff-meta"></span></h2>
        <pre id="handoff" class="scroll">loading…</pre>
      </div>
      <div class="card wide">
        <h2>agent room <span class="muted">— conversation timeline (read-only)</span></h2>
        <div class="actions" id="actions"></div>
        <div class="confirm" id="confirm"></div>
        <div id="timeline" class="timeline">loading…</div>
      </div>
    </main>

    <script type="module">
      // Display-only webview over the relay-baton CLI sidecar. Every piece of
      // data on this page comes from a CLI call; nothing is computed here and
      // nothing is ever written from the UI (project switch calls the CLI's
      // own `project switch`). The diet selector is UI state only — it is
      // passed through to future confirmed agent actions (Phase C), never
      // acted on locally.
      let Command;
      try {
        ({ Command } = await import("@tauri-apps/plugin-shell"));
      } catch {
        // Plain-browser preview — degrade gracefully.
      }

      const $ = (id) => document.getElementById(id);

      async function cli(args) {
        if (!Command) throw new Error("Not running inside Tauri. Build the desktop app to talk to the relay-baton sidecar.");
        const out = await Command.sidecar("binaries/relay-baton", args).execute();
        if (out.code !== 0) throw new Error((out.stderr || out.stdout || `exit ${out.code}`).trim());
        return out.stdout;
      }
      const cliJson = async (args) => JSON.parse(await cli(args));

      function showError(el, err) {
        el.innerHTML = "";
        const p = document.createElement("pre");
        p.className = "err";
        p.textContent = String(err?.message ?? err);
        el.appendChild(p);
      }

      function kvRows(el, pairs) {
        el.innerHTML = "";
        for (const [k, v] of pairs) {
          const dk = document.createElement("span"); dk.className = "k"; dk.textContent = k;
          const dv = document.createElement("span"); dv.textContent = v == null ? "-" : String(v);
          el.append(dk, dv);
        }
      }

      async function loadProjects() {
        const sel = $("project");
        try {
          const data = await cliJson(["project", "list", "--json"]);
          sel.innerHTML = "";
          if (data.projects.length === 0) {
            sel.append(new Option("(cwd — no registered projects)", ""));
            sel.disabled = true;
            return;
          }
          sel.disabled = false;
          for (const p of data.projects) {
            sel.append(new Option(p.name, p.id, false, p.id === data.activeProjectId));
          }
        } catch (err) {
          sel.innerHTML = "";
          sel.append(new Option("(unavailable)", ""));
          sel.disabled = true;
        }
      }

      async function loadStatus() {
        const el = $("status");
        try {
          const s = await cliJson(["status", "--json"]);
          kvRows(el, [
            ["task", s.task],
            ["status", s.status],
            ["agents", `${s.primaryAgent} -> ${s.fallbackAgent}`],
            ["last agent", s.lastAgent],
            ["diet", s.tokenDietProfile],
            ["changed files", s.changedFiles],
            ["handoff", s.handoffExists ? "yes" : "no"],
            ["last error", s.lastError],
          ]);
        } catch (err) { showError(el, err); }
      }

      async function loadBudget() {
        const el = $("budget");
        try {
          const b = await cliJson(["budget", "--json"]);
          const used = b.used?.handoff ?? 0;
          const max = b.maxHandoffChars || 1;
          const pct = Math.min(100, Math.round((used / max) * 100));
          el.innerHTML = "";
          const label = document.createElement("div");
          label.className = "muted";
          label.textContent = `handoff ${used.toLocaleString()} / ${max.toLocaleString()} chars (${pct}%) · profile ${b.activeProfile}`;
          const bar = document.createElement("div"); bar.className = "bar";
          const fill = document.createElement("div");
          fill.style.width = pct + "%";
          if (pct >= 90) fill.className = "hot";
          bar.appendChild(fill);
          const kv = document.createElement("div"); kv.className = "kv";
          el.append(label, bar, kv);
          kvRows(kv, Object.entries(b.used ?? {}).map(([k, v]) => [k, Number(v).toLocaleString() + " chars"]));
        } catch (err) { showError(el, err); }
      }

      async function loadHandoff() {
        const el = $("handoff");
        const meta = $("handoff-meta");
        try {
          const h = await cliJson(["handoff", "show", "--json"]);
          meta.textContent = h.exists ? h.name : "";
          el.classList.remove("err");
          el.textContent = h.exists ? h.content : "(no handoff yet — run `relay-baton handoff` from the CLI)";
        } catch (err) {
          meta.textContent = "";
          el.classList.add("err");
          el.textContent = String(err?.message ?? err);
        }
      }

      async function loadTimeline() {
        const el = $("timeline");
        try {
          const r = await cliJson(["replay", "--json", "--limit", "100"]);
          el.innerHTML = "";
          if (!r.entries || r.entries.length === 0) {
            const d = document.createElement("div");
            d.className = "muted";
            d.textContent = "(no conversation events yet — run `relay-baton chat` from the CLI)";
            el.appendChild(d);
            return;
          }
          for (const e of r.entries) {
            const row = document.createElement("div"); row.className = "ev";
            const who = document.createElement("div"); who.className = "who";
            const role = document.createElement("span");
            const roleClass = "role-" + String(e.role).replace(/[^a-z-]/gi, "").toLowerCase();
            role.className = "role " + roleClass;
            role.textContent = e.agent && e.agent !== e.role ? `${e.role}/${e.agent}` : e.role;
            const kind = document.createElement("div"); kind.className = "kind"; kind.textContent = e.kind;
            const ts = document.createElement("div"); ts.className = "ts"; ts.textContent = e.ts;
            who.append(role, kind, ts);
            const text = document.createElement("div"); text.className = "text"; text.textContent = e.text;
            row.append(who, text);
            el.appendChild(row);
          }
        } catch (err) { showError(el, err); }
      }

      // Confirmation-first action palette. Read-only / no-model commands run
      // directly; agent-launching commands are NEVER run from the GUI — they
      // render a copyable command preview only (the CLI/terminal stays the
      // place where real agent runs happen, with their own confirmation).
      const ACTIONS = [
        { label: "review", args: ["review"], readonly: true, note: "Deterministic diff-vs-plan review. No model call." },
        { label: "diagnose", args: ["doctor", "--deep"], readonly: true, note: "Deep environment + artifact diagnostics. No model call." },
        { label: "status", args: ["status"], readonly: true, note: "Current session status. No model call." },
        { label: "handoff", args: ["handoff", "--to", "claude", "--no-run"], readonly: false, note: "Generates a handoff document. Run from your terminal." },
        { label: "plan", args: ["plan", "<task>"], readonly: false, note: "Launches the planner agent. Run from your terminal." },
        { label: "execute", args: ["execute"], readonly: false, note: "Launches the executor agent. Run from your terminal." },
      ];

      function fmtCmd(args) { return "relay-baton " + args.join(" "); }

      function renderActions() {
        const bar = $("actions");
        bar.innerHTML = "";
        for (const a of ACTIONS) {
          const b = document.createElement("button");
          b.textContent = a.label;
          if (a.readonly) b.classList.add("ro");
          b.title = a.note;
          b.addEventListener("click", () => openConfirm(a));
          bar.appendChild(b);
        }
      }

      function openConfirm(a) {
        const box = $("confirm");
        box.innerHTML = "";
        box.classList.add("show");

        const title = document.createElement("div");
        title.innerHTML = a.readonly
          ? `<span class="role role-relay">${a.label}</span> <span class="muted">read-only — safe to run here</span>`
          : `<span class="role role-relay">${a.label}</span> <span class="warn">launches an agent — copy &amp; run in your terminal</span>`;

        const code = document.createElement("code");
        code.textContent = fmtCmd(a.args);

        const note = document.createElement("div");
        note.className = "muted"; note.textContent = a.note;

        const btns = document.createElement("div"); btns.className = "btns";
        const copy = document.createElement("button"); copy.className = "copy"; copy.textContent = "Copy";
        copy.addEventListener("click", () => navigator.clipboard?.writeText(fmtCmd(a.args)));
        const cancel = document.createElement("button"); cancel.className = "cancel"; cancel.textContent = "Close";
        cancel.addEventListener("click", () => box.classList.remove("show"));
        btns.append(copy);

        if (a.readonly) {
          const run = document.createElement("button"); run.className = "run"; run.textContent = "Run";
          run.addEventListener("click", async () => {
            run.disabled = true; run.textContent = "running…";
            const out = document.createElement("pre"); out.className = "scroll";
            try { out.textContent = (await cli(a.args)).trim() || "(no output)"; }
            catch (err) { out.className += " err"; out.textContent = String(err?.message ?? err); }
            box.appendChild(out);
            run.textContent = "Run";
            run.disabled = false;
            loadTimeline();
          });
          btns.append(run);
        }
        btns.append(cancel);

        box.append(title, code, note, btns);
      }

      async function refresh() {
        await Promise.all([loadProjects(), loadStatus(), loadBudget(), loadHandoff(), loadTimeline()]);
      }

      $("project").addEventListener("change", async (e) => {
        const id = e.target.value;
        if (!id) return;
        try {
          await cli(["project", "switch", id]);
        } catch (err) {
          console.error(err);
        }
        await refresh();
      });

      $("diet").value = localStorage.getItem("rb-diet") ?? "caveman";
      $("diet").addEventListener("change", (e) => localStorage.setItem("rb-diet", e.target.value));

      $("refresh").addEventListener("click", refresh);
      renderActions();
      refresh();
    </script>
  </body>
</html>
