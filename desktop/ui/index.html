<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>relay-baton</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #0d1117;
        color: #e6edf3;
      }
      header {
        padding: 16px 20px;
        border-bottom: 1px solid #21262d;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      header h1 { font-size: 16px; margin: 0; font-weight: 600; }
      header .tag { font-size: 12px; color: #8b949e; }
      main { padding: 20px; display: grid; gap: 16px; }
      .card {
        border: 1px solid #21262d;
        border-radius: 8px;
        padding: 16px;
        background: #161b22;
      }
      .card h2 { font-size: 13px; margin: 0 0 10px; color: #8b949e; text-transform: uppercase; letter-spacing: .04em; }
      pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
      button {
        background: #238636; color: #fff; border: 0; border-radius: 6px;
        padding: 8px 14px; font: inherit; cursor: pointer;
      }
      button:hover { background: #2ea043; }
      .row { display: flex; gap: 8px; margin-bottom: 12px; }
      .muted { color: #8b949e; }
    </style>
  </head>
  <body>
    <header>
      <h1>relay-baton</h1>
      <span class="tag">desktop · v1.1 scaffold</span>
    </header>
    <main>
      <div class="row">
        <button id="refresh">Refresh</button>
        <span class="muted" id="hint">reads the CLI sidecar — display only, never launches agents</span>
      </div>
      <div class="card">
        <h2>status</h2>
        <pre id="status">loading…</pre>
      </div>
      <div class="card">
        <h2>budget</h2>
        <pre id="budget">loading…</pre>
      </div>
    </main>

    <script type="module">
      // Tauri v2 shell plugin. Reuses the packaged CLI as a sidecar; no logic
      // is duplicated in the UI.
      let Command;
      try {
        ({ Command } = await import("@tauri-apps/plugin-shell"));
      } catch {
        // Running in a plain browser (e.g. previewing the HTML) — degrade.
      }

      async function runCli(args, el) {
        const node = document.getElementById(el);
        if (!Command) {
          node.textContent =
            "Not running inside Tauri.\nBuild the desktop app to talk to the relay-baton sidecar.";
          return;
        }
        try {
          const out = await Command.sidecar("binaries/relay-baton", args).execute();
          node.textContent = (out.stdout || out.stderr || "").trim() || "(no output)";
        } catch (err) {
          node.textContent = "error: " + (err?.message ?? String(err));
        }
      }

      async function refresh() {
        await Promise.all([
          runCli(["status", "--json"], "status"),
          runCli(["budget", "--json"], "budget"),
        ]);
      }

      document.getElementById("refresh").addEventListener("click", refresh);
      refresh();
    </script>
  </body>
</html>
