name: Release

# Build standalone, single-file executables for each OS and attach them to the
# GitHub Release for the pushed tag. No publishing to npm, no API calls, no
# secrets beyond the default GITHUB_TOKEN.
#
# Trigger: push a tag like `v1.1.0`.
#   git tag v1.1.0 && git push origin v1.1.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  # v2.2 — sign build provenance for release assets (SLSA-style attestation).
  attestations: write

jobs:
  # Create the GitHub Release exactly once, before the parallel build matrix.
  # Without this, the 3 build jobs race to create the release and one loses with
  # "Validation Failed: tag_name already_exists" (seen on v2.0.0-alpha.4). The
  # build jobs now only upload assets to this already-existing release.
  create-release:
    name: create release
    runs-on: ubuntu-latest
    steps:
      - name: Create the GitHub Release (idempotent)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists — reusing it"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Automated release for $TAG"
          fi

  build-binaries:
    name: build ${{ matrix.label }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            asset: relay-baton-linux-x64
          - os: macos-latest
            label: macos-arm64
            asset: relay-baton-macos-arm64
          - os: windows-latest
            label: windows-x64
            asset: relay-baton-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Enable corepack (activate pinned pnpm)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      # Install the bundler/injector globally so their bins are on PATH.
      # `npx --yes <tool>` does not reliably expose the bin on CI runners
      # (exit 127), so install explicitly. This touches only the global store,
      # not the repo lockfile, so the build/test CI stays unaffected.
      # Pin exact versions verified locally end-to-end. postject's "latest" is a
      # prerelease (1.0.0-alpha.x), so a caret range silently resolves to none;
      # name the exact version instead.
      - name: Install bundler tools (esbuild + postject)
        run: npm install -g esbuild@0.28.0 postject@1.0.0-alpha.6

      # Bundle the compiled CLI (and its workspace deps) into one CommonJS file.
      - name: Bundle CLI into a single file
        run: >-
          esbuild packages/cli/dist/index.js
          --bundle --platform=node --target=node20 --format=cjs
          --outfile=build/relay-baton.cjs

      - name: Generate SEA blob
        run: node --experimental-sea-config bin/sea-config.json

      # --- Copy the host node binary, then inject the SEA blob into it. ---
      - name: Stage node binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist-bin
          cp "$(command -v node)" "dist-bin/${{ matrix.asset }}"

      - name: Remove macOS signature
        if: runner.os == 'macOS'
        run: codesign --remove-signature "dist-bin/${{ matrix.asset }}"

      - name: Inject SEA blob (Unix)
        if: runner.os != 'Windows'
        run: >-
          postject "dist-bin/${{ matrix.asset }}"
          NODE_SEA_BLOB build/sea-prep.blob
          --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          ${{ runner.os == 'macOS' && '--macho-segment-name NODE_SEA' || '' }}

      - name: Re-sign macOS binary (ad-hoc)
        if: runner.os == 'macOS'
        run: codesign --sign - "dist-bin/${{ matrix.asset }}"

      - name: Stage node binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-bin | Out-Null
          node -e "require('fs').copyFileSync(process.execPath, 'dist-bin/${{ matrix.asset }}')"

      - name: Inject SEA blob (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          postject "dist-bin/${{ matrix.asset }}"
          NODE_SEA_BLOB build/sea-prep.blob
          --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - name: Smoke test the binary (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x "dist-bin/${{ matrix.asset }}"
          "./dist-bin/${{ matrix.asset }}" --version

      - name: Smoke test the binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "dist-bin/${{ matrix.asset }}" --version

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist-bin/${{ matrix.asset }}
          draft: false
          fail_on_unmatched_files: true

      # Always upload as a workflow artifact too — the desktop job downloads it
      # to stage as the Tauri sidecar.
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist-bin/${{ matrix.asset }}

  # Build the Tauri desktop app per OS, bundling the SEA CLI binary from the
  # job above as a sidecar. The webview holds no business logic — it only
  # shells out to the bundled CLI (see desktop/README.md).
  build-desktop:
    name: desktop ${{ matrix.label }}
    needs: build-binaries
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      HAS_AZURE_SIGNING: ${{ secrets.AZURE_SIGNING_ENDPOINT != '' && secrets.AZURE_SIGNING_ACCOUNT != '' && secrets.AZURE_SIGNING_CERTIFICATE_PROFILE != '' }}
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_TAURI_UPDATER_SIGNING: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_UPDATER_PUBKEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            asset: relay-baton-linux-x64
            bundle-glob: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            updater-glob: desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
          - os: macos-latest
            label: macos-arm64
            asset: relay-baton-macos-arm64
            bundle-glob: desktop/src-tauri/target/release/bundle/dmg/*.dmg
            updater-glob: |
              desktop/src-tauri/target/release/bundle/macos/*.tar.gz
              desktop/src-tauri/target/release/bundle/macos/*.tar.gz.sig
          - os: windows-latest
            label: windows-x64
            asset: relay-baton-windows-x64.exe
            bundle-glob: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            updater-glob: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: desktop/src-tauri

      # Tauri v2 Linux build prerequisites (webkit2gtk 4.1 on ubuntu-latest).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential curl wget file
          libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Download CLI binary (sidecar source)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist-bin

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Generate icon set
        working-directory: desktop
        run: npm run icon

      - name: Stage CLI sidecar
        working-directory: desktop
        run: npm run stage-sidecar -- --from ../dist-bin/${{ matrix.asset }}

      - name: Enable desktop updater artifacts
        if: env.HAS_TAURI_UPDATER_SIGNING == 'true'
        working-directory: desktop/src-tauri
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.bundle = config.bundle || {};
          config.bundle.createUpdaterArtifacts = true;
          config.plugins = config.plugins || {};
          config.plugins.updater = {
            pubkey: process.env.TAURI_UPDATER_PUBKEY,
            endpoints: [
              'https://github.com/dgl1231/relay-baton/releases/latest/download/latest.json'
            ],
            windows: { installMode: 'passive' }
          };
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Build desktop app
        if: runner.os != 'macOS'
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build

      # macOS (unsigned) DMG bundling via tauri's bundle_dmg.sh intermittently
      # fails when hdiutil cannot detach the mounted image on CI runners (a known
      # flake, unrelated to our code). Retry a few times, cleaning up any leftover
      # mounted volume between attempts so the next `hdiutil attach` is clean.
      - name: Build desktop app (macOS unsigned, retry DMG flake)
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING != 'true'
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set +e
          attempts=3
          for i in $(seq 1 $attempts); do
            echo "::group::desktop build attempt $i/$attempts"
            npm run build
            code=$?
            echo "::endgroup::"
            if [ $code -eq 0 ]; then
              echo "desktop build succeeded on attempt $i"
              exit 0
            fi
            echo "::warning::desktop DMG bundling failed (attempt $i/$attempts, exit $code); cleaning up and retrying"
            for v in /Volumes/relay-baton*; do [ -e "$v" ] && hdiutil detach "$v" -force || true; done
            sleep 15
          done
          echo "::error::desktop build failed after $attempts attempts"
          exit 1

      - name: Build desktop app (signed macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        working-directory: desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build

      - name: Sign Windows installer with Azure Artifact Signing
        if: runner.os == 'Windows' && env.HAS_AZURE_SIGNING == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\desktop\src-tauri\target\release\bundle\nsis
          files-folder-filter: "*-setup.exe"
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ${{ matrix.bundle-glob }}
          draft: false
          fail_on_unmatched_files: true

      - name: Upload updater artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_TAURI_UPDATER_SIGNING == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ${{ matrix.updater-glob }}
          draft: false
          fail_on_unmatched_files: true

      - name: Upload build artifact (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.label }}
          path: ${{ matrix.bundle-glob }}

  release-finalize:
    name: release checksums and SBOM
    needs: [build-binaries, build-desktop]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies for SBOM
        run: pnpm install --frozen-lockfile

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG" --dir release-assets
          rm -f release-assets/SHA256SUMS release-assets/relay-baton.cdx.json release-assets/latest.json

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum * | sort -k2 > SHA256SUMS

      - name: Generate CycloneDX SBOM
        continue-on-error: true
        run: |
          npm install -g @cyclonedx/cyclonedx-npm
          cyclonedx-npm --output-format JSON --output-file release-assets/relay-baton.cdx.json --ignore-npm-errors

      - name: Generate Tauri updater manifest
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/generate-tauri-latest-json.mjs

      # v2.2 — diff this release's SBOM against the previous release's SBOM to
      # surface dependency drift (added/removed/version-changed components).
      # Advisory: never fails the release.
      - name: Diff SBOM against previous release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/sbom-diff.mjs

      - name: Upload release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          files="release-assets/SHA256SUMS"
          if [ -f release-assets/relay-baton.cdx.json ]; then
            files="$files release-assets/relay-baton.cdx.json"
          fi
          if [ -f release-assets/latest.json ]; then
            files="$files release-assets/latest.json"
          fi
          if [ -f release-assets/sbom-diff.md ]; then
            files="$files release-assets/sbom-diff.md"
          fi
          gh release upload "$TAG" $files --clobber

      # v2.2 — publish build provenance (SLSA) for every release binary +
      # metadata file. Works with the default GITHUB_TOKEN (no extra secrets),
      # so signing is on by default. Consumers verify with:
      #   gh attestation verify <file> --repo ${{ github.repository }}
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release-assets/relay-baton-linux-x64
            release-assets/relay-baton-macos-arm64
            release-assets/relay-baton-windows-x64.exe
            release-assets/SHA256SUMS

  # v2.7 Phase 1 — distribution fan-out. Each job no-ops when its secret is
  # absent, so the release never fails just because a channel isn't configured.
  #   NPM_TOKEN           = npm automation token (2FA bypass) for @relay-baton/*
  #   HOMEBREW_TAP_TOKEN  = PAT with write to homebrew-relay-baton + scoop-relay-baton
  #   WINGET_TOKEN        = PAT that can fork + PR microsoft/winget-pkgs
  publish-npm:
    name: publish to npm
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Enable corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm build
      - name: Publish (skipped if NPM_TOKEN unset)
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          # setup-node's registry-url writes an .npmrc that reads NODE_AUTH_TOKEN
          # (it overrides any hand-written ~/.npmrc — a manual echo gets ignored
          # and npm returns 404 on scoped PUTs when the token expands empty).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # pnpm rewrites workspace:* and skips versions already on the registry
          corepack pnpm -r publish --access public --no-git-checks

  update-brew-scoop:
    name: update Homebrew tap + Scoop bucket
    needs: release-finalize
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Render + push manifests (skipped if HOMEBREW_TAP_TOKEN unset)
        if: ${{ env.TAP_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          gh release download "$TAG" --pattern SHA256SUMS --dir /tmp --clobber
          VERSION="$VER" node .github/scripts/render-pm-manifests.mjs /tmp/SHA256SUMS /tmp/pm
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${OWNER}/homebrew-relay-baton.git" /tmp/tap
          mkdir -p /tmp/tap/Formula && cp /tmp/pm/Formula/relay-baton.rb /tmp/tap/Formula/relay-baton.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${OWNER}/scoop-relay-baton.git" /tmp/bucket
          mkdir -p /tmp/bucket/bucket && cp /tmp/pm/bucket/relay-baton.json /tmp/bucket/bucket/relay-baton.json
          for d in /tmp/tap /tmp/bucket; do
            git -C "$d" config user.name "github-actions[bot]"
            git -C "$d" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$d" add -A
            git -C "$d" commit -m "relay-baton ${VER}" || { echo "no changes in $d"; continue; }
            git -C "$d" push
          done

  update-winget:
    name: submit Winget update
    needs: release-finalize
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit PR to winget-pkgs (skipped if WINGET_TOKEN unset)
        if: ${{ env.WINGET_TOKEN != '' }}
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/relay-baton-windows-x64.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update dgl1231.relay-baton --version $ver --urls "$url" --submit --token $env:WINGET_TOKEN
