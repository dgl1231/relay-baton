ShortDescription: Token-aware handoff harness for Codex CLI and Claude Code.
Description: >-
  relay-baton is a local handoff + token-diet harness that lets Codex CLI and
  Claude Code take turns on the same repository without re-pasting the chat log,
  the diff, or the repo. Subprocess-only, deterministic, no direct LLM API calls.
